manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis      # required by the ARM port
          - cmsis_6    # Cortex-M CMSIS headers
          - hal_stm32
          - hal_infineon  # AIROC Bluetooth HCD glue (AP6212)
          - mbedtls       # PSA crypto for the Bluetooth host
          - tf-psa-crypto
