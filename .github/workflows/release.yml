# SPDX-License-Identifier: Apache-2.0
#
# On a pushed tag: build apps/pilot_wire (pilot wire over Bluetooth) for
# intuitiv and publish zephyr.bin and zephyr.elf in a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: intuitiv

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: intuitiv
          toolchains: arm-zephyr-eabi

      # The AP6212 patchram is not committed (see README, Bluetooth)
      - name: Fetch the patchram
        run: >
          curl -fL -o intuitiv/apps/bluetooth/bcm43438a0.hcd
          https://raw.githubusercontent.com/armbian/firmware/master/ap6212/bcm43438a0.hcd

      - name: Build
        run: west build -b intuitiv intuitiv/apps/pilot_wire

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/zephyr/zephyr.bin "pilot_wire-$TAG.bin"
          cp build/zephyr/zephyr.elf "pilot_wire-$TAG.elf"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes \
            "pilot_wire-$TAG.bin" "pilot_wire-$TAG.elf"
