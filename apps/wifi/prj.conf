CONFIG_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_ENTROPY_GENERATOR=y

CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y
# AP6212 = BCM43430A0, firmware and NVRAM from fw/ (whd_resources.c)
CONFIG_AIROC_WIFI_CUSTOM=y
CONFIG_SDIO_STACK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

# Exception to the no-heap rule: the vendor WHD driver and its RTOS
# abstraction allocate with k_malloc. Our code stays static.
CONFIG_HEAP_MEM_POOL_SIZE=49152
