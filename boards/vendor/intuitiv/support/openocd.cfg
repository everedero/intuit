source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]
reset_config none

$_TARGETNAME configure -event gdb-attach {
        echo "Debugger attaching: halting execution"
        reset halt
        gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}

# BOOT0 is strapped high through the bottom test pad, so every reset starts
# the ROM bootloader: start the flashed image from its vector table instead.
# Called by west flash (--cmd-post-verify) before its final 'reset run'.
proc intuitiv_run_app {} {
        halt
        reg msp [read_memory 0x08000000 32 1]
        reg pc [read_memory 0x08000004 32 1]
        resume
        shutdown
}
